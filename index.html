<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUROLIX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #080808;
      --silver: #c8c8c8;
      --silver-dim: #888;
      --silver-ghost: #444;
      --border: #1e1e1e;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--silver);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3 {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      letter-spacing: 0.15em;
    }

    section {
      padding: 160px 8vw;
    }

    /* ─── NAVIGATION ─── */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(8, 8, 8, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 80px;
      padding: 28px 8vw;
    }

    nav a {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3em;
      color: var(--silver-dim);
    }

    nav a:hover {
      color: var(--silver);
    }

    /* ─── HERO ─── */
    #hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8vw;
      position: relative;
    }

    #hero h1 {
      font-size: clamp(38px, 11vw, 180px);
      font-weight: 600;
      letter-spacing: 0.25em;
      color: var(--silver);
      text-align: center;
    }

    /* ─── ABOUT ─── */
    #about {
      text-align: center;
      border-top: 1px solid var(--border);
    }

    #about h2 {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: var(--silver-dim);
      margin-bottom: 80px;
    }

    .about-words {
      display: flex;
      justify-content: center;
      gap: clamp(40px, 8vw, 120px);
      flex-wrap: wrap;
    }

    .about-words span {
      font-family: 'Cinzel', serif;
      font-size: clamp(20px, 2.5vw, 32px);
      letter-spacing: 0.3em;
      color: var(--silver);
    }

    /* ─── COLLECTION ─── */
    #collection {
      border-top: 1px solid var(--border);
    }

    #collection h2 {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: var(--silver-dim);
      text-align: center;
      margin-bottom: 100px;
    }

    .collection-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .product {
      display: flex;
      flex-direction: column;
    }

    .product-image {
      aspect-ratio: 3 / 4;
      background: #0d0d0d;
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .product-name {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: var(--silver);
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 14px;
      color: var(--silver-dim);
      font-style: italic;
    }

    /* ─── CONTACT ─── */
    #contact {
      text-align: center;
      border-top: 1px solid var(--border);
    }

    #contact h2 {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: var(--silver-dim);
      margin-bottom: 80px;
    }

    .contact-links {
      display: flex;
      justify-content: center;
      gap: 60px;
      flex-wrap: wrap;
    }

    .contact-links a {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--silver);
      padding-bottom: 6px;
      border-bottom: 1px solid var(--silver-ghost);
    }

    .contact-links a:hover {
      color: var(--silver);
      border-bottom-color: var(--silver);
    }

    /* ─── FOOTER ─── */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 8vw;
      text-align: center;
    }

    footer p {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--silver-ghost);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      section {
        padding: 100px 6vw;
      }

      nav {
        gap: 32px;
        padding: 20px 6vw;
      }

      nav a {
        font-size: 10px;
        letter-spacing: 0.2em;
      }

      .collection-grid {
        grid-template-columns: 1fr;
        gap: 60px;
      }

      .contact-links {
        flex-direction: column;
        gap: 32px;
      }
    }
  </style>

  <!-- LOADER STYLES (additive) -->
  <style>
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f0f0f0;
      overflow: hidden;
    }
    #loader-canvas {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
    }
    body.loader-active {
      overflow: hidden;
    }
  </style>
</head>
<body class="loader-active">

  <!-- LOADER -->
  <div id="loader">
    <canvas id="loader-canvas"></canvas>
  </div>

  <!-- NAVIGATION -->
  <header>
    <nav>
      <a href="#collection">COLLECTION</a>
      <a href="#about">ABOUT</a>
      <a href="#contact">CONTACT</a>
    </nav>
  </header>

  <!-- HERO -->
  <section id="hero">
    <h1>AUROLIX</h1>
  </section>

  <!-- ABOUT -->
  <section id="about">
    <h2>ABOUT</h2>
    <div class="about-words">
      <span>DISCIPLINE.</span>
      <span>AMBITION.</span>
      <span>IDENTITY.</span>
    </div>
  </section>

  <!-- COLLECTION -->
  <section id="collection">
    <h2>COLLECTION</h2>
    <div class="collection-grid">
      <div class="product">
        <div class="product-image"></div>
        <div class="product-name">PIECE 01</div>
        <div class="product-price">— coming soon —</div>
      </div>
      <div class="product">
        <div class="product-image"></div>
        <div class="product-name">PIECE 02</div>
        <div class="product-price">— coming soon —</div>
      </div>
      <div class="product">
        <div class="product-image"></div>
        <div class="product-name">PIECE 03</div>
        <div class="product-price">— coming soon —</div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact">
    <h2>CONTACT</h2>
    <div class="contact-links">
      <a href="#" target="_blank" rel="noopener">INSTAGRAM</a>
      <a href="#" target="_blank" rel="noopener">X</a>
      <a href="mailto:">EMAIL</a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 AUROLIX</p>
  </footer>

  <!-- LOADER ANIMATION -->
  <script>
    (function () {
      const loader = document.getElementById('loader');
      const canvas = document.getElementById('loader-canvas');
      if (!loader || !canvas) return;

      const ctx = canvas.getContext('2d');
      let W = 0, H = 0, DPR = 1;

      function resize() {
        DPR = Math.max(1, window.devicePixelRatio || 1);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width  = Math.max(1, Math.floor(W * DPR));
        canvas.height = Math.max(1, Math.floor(H * DPR));
        canvas.style.width  = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      // ─── Preload logo image ───
      const logoImg = new Image();
      let logoLoaded = false;
      logoImg.onload = function () { logoLoaded = true; };
      logoImg.onerror = function () { logoLoaded = false; };
      logoImg.src = 'AUROLIX_LOGO.jpg';

      // ─── Phase durations (ms) ───
      const T = {
        INTRO:   1200,  // white water with subtle idle ripples
        DROP:     900,  // ink drop falling from top
        IMPACT:  1400,  // splash + expanding ripples
        SPREAD:  1500,  // ink fills the entire screen
        LOGO:    1500,  // logo image fades in (1.5s)
        FADEOUT:  800   // fade loader away to reveal site
      };
      const ORDER = ['INTRO', 'DROP', 'IMPACT', 'SPREAD', 'LOGO', 'FADEOUT'];
      const start = {};
      let acc = 0;
      ORDER.forEach(k => { start[k] = acc; acc += T[k]; });
      const TOTAL = acc;

      // Idle ripples on the white surface
      const idleRipples = [];
      for (let i = 0; i < 5; i++) {
        idleRipples.push({
          x: Math.random(),
          y: Math.random(),
          delay: Math.random() * 1200,
          duration: 1400 + Math.random() * 700,
          maxR: 50 + Math.random() * 70
        });
      }

      // Easings
      const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
      const easeInQuad   = t => t * t;
      const easeInOutCubic = t =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function drawWhiteSurface() {
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(0, 0, W, H);
      }

      function drawIdleRipples(localT) {
        for (let i = 0; i < idleRipples.length; i++) {
          const r = idleRipples[i];
          const rt = (localT - r.delay) / r.duration;
          if (rt > 0 && rt < 1) {
            const radius = Math.max(0, rt * r.maxR);
            const opacity = Math.max(0, 0.22 * (1 - rt));
            ctx.strokeStyle = 'rgba(160, 160, 160, ' + opacity + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(r.x * W, r.y * H, radius, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
      }

      function drawLogo(cx, cy, opacity) {
        if (!logoLoaded) return;

        const isMobile = W <= 768;
        const targetW  = W * (isMobile ? 0.70 : 0.40);
        const nw = logoImg.naturalWidth  || 1;
        const nh = logoImg.naturalHeight || 1;
        const drawW = targetW;
        const drawH = drawW * (nh / nw);

        ctx.globalAlpha = Math.max(0, Math.min(1, opacity));
        ctx.drawImage(
          logoImg,
          cx - drawW / 2,
          cy - drawH / 2,
          drawW,
          drawH
        );
        ctx.globalAlpha = 1;
      }

      const startTime = performance.now();

      function frame(now) {
        const t = now - startTime;
        const cx = W / 2;
        const cy = H / 2;

        ctx.clearRect(0, 0, W, H);

        if (t < start.DROP) {
          // ── PHASE 1: white water + subtle ripples ──
          drawWhiteSurface();
          drawIdleRipples(t);
        }
        else if (t < start.IMPACT) {
          // ── PHASE 2: ink drop falling ──
          drawWhiteSurface();
          drawIdleRipples(t);

          const localT = (t - start.DROP) / T.DROP;
          const eased  = easeInQuad(localT);
          const dropY  = -20 + eased * (cy + 20);
          const dropR  = Math.max(0, 5 + localT * 5);

          // Trailing tail (stretched as gravity accelerates)
          if (localT > 0.25) {
            const tailLen = 40 * easeInQuad(localT);
            const grad = ctx.createLinearGradient(cx, dropY - tailLen, cx, dropY);
            grad.addColorStop(0, 'rgba(8, 8, 8, 0)');
            grad.addColorStop(1, 'rgba(8, 8, 8, 0.85)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.moveTo(cx - dropR * 0.35, dropY);
            ctx.lineTo(cx, dropY - tailLen);
            ctx.lineTo(cx + dropR * 0.35, dropY);
            ctx.closePath();
            ctx.fill();
          }

          // Drop head
          ctx.fillStyle = '#080808';
          ctx.beginPath();
          ctx.arc(cx, dropY, dropR, 0, Math.PI * 2);
          ctx.fill();
        }
        else if (t < start.SPREAD) {
          // ── PHASE 3: impact + ripples + small puddle ──
          drawWhiteSurface();

          const localT = (t - start.IMPACT) / T.IMPACT;

          // Multiple expanding rings
          const maxRingR = Math.max(W, H) * 0.7;
          for (let i = 0; i < 5; i++) {
            const offset = i * 0.13;
            const rt = localT - offset;
            if (rt > 0 && rt < 1) {
              const radius = Math.max(0, easeOutCubic(rt) * maxRingR);
              const opacity = Math.max(0, 0.45 * (1 - rt));
              ctx.strokeStyle = 'rgba(40, 40, 40, ' + opacity + ')';
              ctx.lineWidth = Math.max(0.5, 1.5 * (1 - rt));
              ctx.beginPath();
              ctx.arc(cx, cy, radius, 0, Math.PI * 2);
              ctx.stroke();
            }
          }

          // Splash crown (small droplets bouncing up at first)
          if (localT < 0.45) {
            const splashT = localT / 0.45;
            const splashR = Math.max(0, 8 + splashT * 30);
            const droplets = 6;
            for (let i = 0; i < droplets; i++) {
              const angle = (i / droplets) * Math.PI * 2;
              const dist = splashR;
              const dx = cx + Math.cos(angle) * dist;
              const dy = cy + Math.sin(angle) * dist - splashT * 12;
              const dr = Math.max(0, 2.5 * (1 - splashT));
              ctx.fillStyle = 'rgba(8, 8, 8, ' + (0.85 * (1 - splashT)) + ')';
              ctx.beginPath();
              ctx.arc(dx, dy, dr, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          // Central ink puddle growing
          const puddleR = Math.max(0, 6 + easeOutCubic(localT) * 90);
          ctx.fillStyle = '#080808';
          ctx.beginPath();
          ctx.arc(cx, cy, puddleR, 0, Math.PI * 2);
          ctx.fill();
        }
        else if (t < start.LOGO) {
          // ── PHASE 4: ink spreads to fill the screen ──
          drawWhiteSurface();

          const localT = (t - start.SPREAD) / T.SPREAD;
          const eased  = easeInOutCubic(localT);

          const maxR = Math.sqrt(W * W + H * H) / 2 + 80;
          const r = Math.max(0, 96 + eased * maxR);

          ctx.fillStyle = '#080808';
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fill();
        }
        else if (t < start.FADEOUT) {
          // ── PHASE 5: logo emerges from black ──
          ctx.fillStyle = '#080808';
          ctx.fillRect(0, 0, W, H);

          const localT = (t - start.LOGO) / T.LOGO;
          const opacity = easeOutCubic(localT);

          drawLogo(cx, cy, opacity);
        }
        else if (t < TOTAL) {
          // ── PHASE 6: fade entire loader away ──
          ctx.fillStyle = '#080808';
          ctx.fillRect(0, 0, W, H);
          drawLogo(cx, cy, 1);

          const localT = (t - start.FADEOUT) / T.FADEOUT;
          loader.style.opacity = String(1 - localT);
        }
        else {
          // ── DONE ──
          document.body.classList.remove('loader-active');
          if (loader.parentNode) loader.parentNode.removeChild(loader);
          window.removeEventListener('resize', resize);
          return;
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>

</body>
</html>
